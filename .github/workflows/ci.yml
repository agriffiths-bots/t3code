name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check
        run: vp check

      - name: Typecheck
        run: vpr typecheck

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs
          grep -n "__clerk_internal_electron_passkeys" apps/desktop/dist-electron/preload.cjs

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: vp run test

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Expose pnpm
        shell: bash
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - id: mobile_prebuild_scope
        name: Check mobile prebuild scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(apps/mobile/|\.github/workflows/(ci|main-artifacts-release|release|reusable-build-release-artifacts)\.yml$)' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf 'Mobile prebuild preflight enabled by changed paths:\n%s\n' "$changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No mobile or release workflow changes; skipping mobile prebuild preflight."
          fi

      - name: Prebuild mobile Android config
        if: github.event_name == 'pull_request' && steps.mobile_prebuild_scope.outputs.run == 'true'
        working-directory: apps/mobile
        env:
          APP_VARIANT: preview
          EXPO_NO_GIT_STATUS: "1"
          EXPO_OWNER: ${{ vars.EXPO_OWNER || 'adam0410' }}
          EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID || 'c5d56501-d2d8-444d-8b4a-b54ead1ba0f7' }}
          EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL || 'https://u.expo.dev/c5d56501-d2d8-444d-8b4a-b54ead1ba0f7' }}
          MOBILE_APP_VERSION: 0.0.0-preflight.${{ github.run_number }}
          MOBILE_VERSION_POLICY: appVersion
        run: pnpm exec expo prebuild --clean --platform android --no-install

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

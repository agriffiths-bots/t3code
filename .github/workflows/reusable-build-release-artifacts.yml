name: Reusable Build Release Artifacts

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to build"
        required: true
        type: string
      release_tag:
        description: "GitHub Release tag to create or update"
        required: true
        type: string
      release_name:
        description: "GitHub Release display name"
        required: true
        type: string
      release_version:
        description: "Application version passed into packaged artifacts"
        required: true
        type: string
      android_required:
        description: "Whether a missing Android APK should fail the release"
        required: false
        default: false
        type: boolean
      android_profile:
        description: "EAS build profile used for the Android APK"
        required: false
        default: preview
        type: string
      android_environment:
        description: "EAS environment pulled before the Android APK build"
        required: false
        default: preview
        type: string
      android_app_variant:
        description: "APP_VARIANT passed to the Expo app config"
        required: false
        default: preview
        type: string
      android_artifact_name:
        description: "Downloaded APK filename to publish"
        required: false
        default: t3-code-preview-android.apk
        type: string
      android_mobile_version_policy:
        description: "MOBILE_VERSION_POLICY passed to the Expo app config"
        required: false
        default: fingerprint
        type: string
      android_app_version:
        description: "Expo app version passed to the mobile app config"
        required: false
        default: ""
        type: string
      android_public_config:
        description: "Whether to inject reusable workflow public config into the Android EAS environment"
        required: false
        default: true
        type: boolean
      platform:
        description: "Release artifact platform subset to build"
        required: false
        default: both
        type: string
      prerelease:
        description: "Whether the GitHub Release is a prerelease"
        required: false
        default: true
        type: boolean
      make_latest:
        description: "Whether this release should become the repository latest release"
        required: false
        default: false
        type: boolean
      windows_signing:
        description: "Enable Windows signing when Azure Trusted Signing secrets are configured"
        required: false
        default: false
        type: boolean
      clerk_publishable_key:
        description: "Clerk publishable key embedded into desktop/web bundles"
        required: false
        default: ""
        type: string
      clerk_jwt_template:
        description: "Clerk JWT template embedded into web/mobile cloud config"
        required: false
        default: ""
        type: string
      clerk_cli_oauth_client_id:
        description: "Clerk OAuth client ID embedded into the desktop server bundle"
        required: false
        default: ""
        type: string
      relay_url:
        description: "T3 Connect relay URL embedded into desktop/web bundles"
        required: false
        default: ""
        type: string
    secrets:
      EXPO_TOKEN:
        description: "Expo token used for non-interactive EAS APK builds"
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_PUBLISHER_NAME:
        required: false

permissions:
  contents: read
  actions: write

jobs:
  android_preflight:
    name: Check Android release credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      expo_token_present: ${{ steps.expo.outputs.present }}
    steps:
      - id: expo
        name: Validate EXPO_TOKEN
        env:
          ANDROID_REQUIRED: ${{ inputs.android_required }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ inputs.platform }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PLATFORM" in
            both|android|windows) ;;
            *)
              echo "::error::Unsupported platform '$PLATFORM'. Expected both, android, or windows."
              exit 1
              ;;
          esac

          if [[ "$PLATFORM" == "windows" ]]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Android was not selected; skipping EXPO_TOKEN validation."
            exit 0
          fi

          if [[ -n "${EXPO_TOKEN:-}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "present=false" >> "$GITHUB_OUTPUT"
          if [[ "$ANDROID_REQUIRED" == "true" ]]; then
            echo "::error::EXPO_TOKEN is required for stable Android APK release artifacts."
            echo "Create a repository secret named EXPO_TOKEN with access to the EAS production project used by apps/mobile."
            exit 1
          fi

          {
            echo "::warning::EXPO_TOKEN is required to build the Android APK release artifact."
            echo "Create a repository secret named EXPO_TOKEN with access to the EAS project used by apps/mobile."
            echo "Also verify EXPO_OWNER / EXPO_PROJECT_ID repository variables if the defaults are not correct."
          }

  server_e2e_gate:
    name: Server E2E Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install e2e gate dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build server bundle
        run: vp run --filter t3 build

      - name: Run server e2e gate
        shell: bash
        run: |
          set -euo pipefail
          t3_home="$(mktemp -d)"
          project_dir="$(mktemp -d)"
          port="$(
            node - <<'NODE'
          const net = require("node:net");
          const server = net.createServer();
          server.listen(0, "127.0.0.1", () => {
            console.log(server.address().port);
            server.close();
          });
          NODE
          )"
          origin="http://127.0.0.1:$port"
          server_log="$t3_home/server.log"

          cleanup() {
            if [[ -n "${server_pid:-}" ]] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            if [[ -f "$server_log" ]]; then
              echo "::group::server e2e gate log"
              tail -200 "$server_log" || true
              echo "::endgroup::"
            fi
          }
          trap cleanup EXIT

          T3CODE_HOME="$t3_home" T3CODE_NO_BROWSER=1 \
            node apps/server/dist/bin.mjs serve \
              --port "$port" \
              --host 127.0.0.1 \
              --base-dir "$t3_home" \
              "$project_dir" \
              >"$server_log" 2>&1 &
          server_pid=$!

          ready=0
          for _ in $(seq 1 60); do
            if grep -q "T3 Code server is ready." "$server_log"; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "::error::Server exited before e2e gate readiness."
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo "::error::Timed out waiting for server e2e gate readiness."
            exit 1
          fi

          GATE_SRV_PID="$server_pid" SQLITE="$(command -v sqlite3)" \
            apps/server/e2e/drive.sh \
              "$t3_home" \
              "$origin" \
              "$project_dir" \
              codex \
              gpt-5-codex \
              "Create and link the e2e child thread."
          server_pid=""

          T3_HOME="$t3_home" node --experimental-sqlite --input-type=module <<'NODE'
          import * as NodeFS from "node:fs";
          import * as NodePath from "node:path";
          import { childrenOf, close, openState } from "./apps/server/e2e/assert.mjs";

          const t3Home = process.env.T3_HOME;
          const linkagePath = NodePath.join(t3Home, ".gate-linkage");
          const [parentId, childId] = NodeFS.readFileSync(linkagePath, "utf8").trim().split(/\s+/);
          if (!parentId || !childId) {
            throw new Error(`Invalid gate linkage file at ${linkagePath}`);
          }

          const db = openState(NodePath.join(t3Home, "userdata", "state.sqlite"));
          try {
            const children = childrenOf(db, parentId);
            if (!children.some((child) => child.thread_id === childId && child.parent_thread_id === parentId)) {
              throw new Error(`Missing projected child ${childId} under parent ${parentId}`);
            }
            console.log(`server e2e gate projected child ${childId} under parent ${parentId}`);
          } finally {
            close(db);
          }
          NODE

  android_apk:
    name: Build Android APK
    needs: android_preflight
    if: inputs.platform != 'windows' && needs.android_preflight.outputs.expo_token_present == 'true'
    runs-on: ubuntu-24.04
    # EAS cloud builds queue + build can exceed 45 min on shared runners.
    timeout-minutes: 90
    # When Android is optional (main prereleases), a failing EAS build must not
    # turn the whole release run red — Windows still publishes. Stable releases
    # keep Android required, so there a failure fails the run as before.
    continue-on-error: ${{ !inputs.android_required }}
    env:
      APP_VARIANT: ${{ inputs.android_app_variant }}
      MOBILE_APP_VERSION: ${{ inputs.android_app_version }}
      MOBILE_VERSION_POLICY: ${{ inputs.android_mobile_version_policy }}
      NODE_OPTIONS: --max-old-space-size=8192
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_UPDATES_URL: ${{ vars.EXPO_UPDATES_URL }}
      # Only inject the caller's validated public_config outputs (never raw repo
      # vars) so an incomplete/insecure config cannot be partially embedded.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ inputs.android_public_config && inputs.clerk_publishable_key || '' }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ inputs.android_public_config && inputs.clerk_jwt_template || '' }}
      T3CODE_RELAY_URL: ${{ inputs.android_public_config && inputs.relay_url || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Expose pnpm
        shell: bash
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Pull Android environment variables
        working-directory: apps/mobile
        env:
          EAS_ENVIRONMENT: ${{ inputs.android_environment }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas env:pull "$EAS_ENVIRONMENT" --non-interactive

      - name: Materialize Android app version
        if: inputs.android_app_version != ''
        working-directory: apps/mobile
        env:
          MOBILE_APP_VERSION: ${{ inputs.android_app_version }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.MOBILE_APP_VERSION?.trim();
          if (!version) {
            throw new Error("MOBILE_APP_VERSION is required when materializing release-version.json.");
          }
          fs.writeFileSync("release-version.json", `${JSON.stringify({ version }, null, 2)}\n`);
          NODE

      - name: Build APK with EAS
        working-directory: apps/mobile
        env:
          APK_ARTIFACT_NAME: ${{ inputs.android_artifact_name }}
          EAS_PROFILE: ${{ inputs.android_profile }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          eas_status=0
          eas build --profile "$EAS_PROFILE" --platform android --non-interactive --wait --json > eas-build.json 2> >(tee release-assets/eas-build.stderr >&2) || eas_status=$?
          cp eas-build.json release-assets/eas-build.json 2>/dev/null || true

          build_id="$(
            node - <<'NODE'
          const fs = require("node:fs");

          const readText = (file) => {
            try {
              return fs.readFileSync(file, "utf8");
            } catch {
              return "";
            }
          };

          const findBuild = (value) => {
            if (Array.isArray(value)) {
              for (const item of value) {
                const build = findBuild(item);
                if (build) return build;
              }
              return null;
            }
            if (value === null || typeof value !== "object") return null;
            if (typeof value.id === "string") return value;
            for (const key of ["build", "data", "result"]) {
              const build = findBuild(value[key]);
              if (build) return build;
            }
            return null;
          };

          let id = "";
          const jsonText = readText("eas-build.json").trim();
          if (jsonText) {
            try {
              id = findBuild(JSON.parse(jsonText))?.id ?? "";
            } catch {
              id = "";
            }
          }

          if (!id) {
            const stderr = readText("release-assets/eas-build.stderr");
            id =
              stderr.match(/\/builds\/([0-9a-f-]{36})/i)?.[1] ??
              stderr.match(/\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b/i)?.[0] ??
              "";
          }

          process.stdout.write(id);
          NODE
          )"

          if [[ -n "$build_id" ]]; then
            echo "EAS build id: $build_id"
          fi

          if (( eas_status != 0 )); then
            echo "::error::EAS Android build failed with exit code $eas_status."
            if [[ -z "${EXPO_TOKEN:-}" ]]; then
              echo "::warning::EXPO_TOKEN is unavailable; cannot fetch EAS build metadata or logs."
            elif [[ -n "$build_id" ]]; then
              if eas build:view "$build_id" --json > release-assets/eas-build-view.json; then
                node - <<'NODE'
          const fs = require("node:fs");

          const build = JSON.parse(fs.readFileSync("release-assets/eas-build-view.json", "utf8"));
          console.log(`EAS status: ${build.status ?? "unknown"}`);
          const accountName = build.project?.ownerAccount?.name;
          const projectSlug = build.project?.slug;
          const dashboardUrl =
            typeof accountName === "string" && typeof projectSlug === "string" && typeof build.id === "string"
              ? `https://expo.dev/accounts/${accountName}/projects/${projectSlug}/builds/${build.id}`
              : "see the build URL printed above";
          console.log(`EAS dashboard: ${dashboardUrl}`);
          if (build.error) {
            console.log(`EAS error code: ${build.error.errorCode ?? "unknown"}`);
            console.log(`EAS error message: ${build.error.message ?? "unknown"}`);
            if (build.error.docsUrl) console.log(`EAS error docs: ${build.error.docsUrl}`);
          }
          const logFiles = Array.isArray(build.logFiles) ? build.logFiles : [];
          console.log(`EAS log files available in Expo: ${logFiles.length}`);
          const logUrls = logFiles.filter((url) => typeof url === "string" && /^https?:\/\//.test(url));
          fs.writeFileSync(
            "release-assets/eas-log-urls.txt",
            logUrls.length > 0 ? `${logUrls.join("\n")}\n` : ""
          );
          NODE
                if [[ -s release-assets/eas-log-urls.txt ]]; then
                  echo "::group::EAS Android build diagnostics"
                  echo "::notice::Fetched EAS logs are reduced to failure-matching diagnostic excerpts before printing."
                  log_index=0
                  while IFS= read -r log_url; do
                    [[ -n "$log_url" ]] || continue
                    log_index=$((log_index + 1))
                    tmp_log="release-assets/eas-log-$log_index"
                    tmp_log_text="$tmp_log.txt"
                    echo "::group::EAS log file $log_index"
                    if curl --fail --location --silent --show-error "$log_url" --output "$tmp_log"; then
                      if gzip -t "$tmp_log" 2>/dev/null; then
                        gzip -dc "$tmp_log" > "$tmp_log_text"
                      else
                        cp "$tmp_log" "$tmp_log_text"
                      fi
                      node - "$tmp_log_text" <<'NODE'
          const fs = require("node:fs");

          const logPath = process.argv[2];
          const interestingLine =
            /\b(?:error|failed|failure|exception|stacktrace|cannot|could not|undefined|invalid|denied|unauthorized|forbidden|config|plugin|project id|app version|gradle|eas build failed)\b/i;
          const sensitiveName =
            /(?:TOKEN|SECRET|PASSWORD|PRIVATE|CREDENTIAL|KEY|CERT|AZURE|CLERK|SENTRY|AXIOM|OTLP|GOOGLE|FIREBASE)/i;
          const redactions = new Set();

          const addRedaction = (value, { force = false } = {}) => {
            if (typeof value !== "string") return;
            const trimmed = value.trim();
            if (trimmed.length < (force ? 8 : 20)) return;
            if (/^(?:true|false|null|undefined)$/i.test(trimmed)) return;
            redactions.add(trimmed);
          };

          for (const [name, value] of Object.entries(process.env)) {
            addRedaction(value, { force: sensitiveName.test(name) });
          }

          for (const envPath of [".env", ".env.local", ".env.preview", ".env.production"]) {
            if (!fs.existsSync(envPath)) continue;
            for (const line of fs.readFileSync(envPath, "utf8").split(/\r?\n/)) {
              const match = line.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)\s*$/);
              if (!match) continue;
              const [, name, rawValue] = match;
              const value = rawValue.trim().replace(/^(['"])(.*)\1$/, "$2");
              addRedaction(value, { force: sensitiveName.test(name) });
            }
          }

          const sanitize = (line) => {
            let text = line
              .replace(/\u001b\[[0-9;]*m/g, "")
              .replace(
                /\b([A-Z0-9_]*(?:TOKEN|SECRET|PASSWORD|PRIVATE|CREDENTIAL|KEY|CERT)[A-Z0-9_]*)\s*[:=]\s*("[^"]*"|'[^']*'|\S+)/gi,
                "$1=[redacted]"
              )
              .replace(/https?:\/\/\S+/g, (value) => {
                try {
                  const url = new URL(value);
                  return `${url.origin}${url.pathname}${url.search ? "?[redacted]" : ""}`;
                } catch {
                  return "[redacted-url]";
                }
              })
              .replace(/\b[0-9a-f]{32,}\b/gi, "[redacted-hex]")
              .replace(/\b[A-Za-z0-9_+/=-]{24,}\b/g, (value) =>
                /^[0-9]+$/.test(value) ? value : "[redacted-token]"
              );

            for (const value of [...redactions].sort((a, b) => b.length - a.length)) {
              text = text.split(value).join("[redacted]");
            }
            return text;
          };

          const lines = fs.readFileSync(logPath, "utf8").split(/\r?\n/);
          const keep = new Set();
          for (let index = 0; index < lines.length; index += 1) {
            if (!interestingLine.test(lines[index])) continue;
            for (let offset = -2; offset <= 4; offset += 1) {
              const keptIndex = index + offset;
              if (keptIndex >= 0 && keptIndex < lines.length) keep.add(keptIndex);
            }
          }

          if (keep.size === 0) {
            console.log("No failure-matching lines found in this EAS log file.");
            process.exit(0);
          }

          let previous = -2;
          for (const index of [...keep].sort((a, b) => a - b)) {
            if (index !== previous + 1) console.log("...");
            previous = index;
            console.log(`${index + 1}: ${sanitize(lines[index])}`);
          }
          NODE
                    else
                      echo "::warning::Failed to download EAS log file $log_index."
                    fi
                    echo
                    echo "::endgroup::"
                  done < release-assets/eas-log-urls.txt
                  echo "::endgroup::"
                else
                  echo "::warning::EAS build metadata did not include downloadable log files."
                fi
              else
                echo "::warning::Failed to fetch EAS build metadata for $build_id."
              fi
            fi
            exit "$eas_status"
          fi

          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const parsed = JSON.parse(fs.readFileSync("eas-build.json", "utf8"));
          const build = Array.isArray(parsed) ? parsed[0] : parsed;
          const url =
            build?.artifacts?.buildUrl ??
            build?.artifacts?.applicationArchiveUrl ??
            build?.artifactUrl ??
            build?.url;
          if (!url) {
            console.error(JSON.stringify(parsed, null, 2));
            throw new Error("EAS build output did not include a downloadable APK URL.");
          }
          fs.mkdirSync(path.resolve("release-assets"), { recursive: true });
          fs.writeFileSync(path.resolve("release-assets", "apk-url.txt"), `${url}\n`);
          NODE
          apk_url="$(cat release-assets/apk-url.txt)"
          curl --fail --location "$apk_url" --output "release-assets/$APK_ARTIFACT_NAME"

      - name: Cancel paired release jobs
        if: ${{ failure() && inputs.platform == 'both' && inputs.android_required }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: apps/mobile/release-assets/*
          if-no-files-found: error

  build_wsl_node_pty:
    name: Build WSL node-pty linux-x64
    needs: android_preflight
    if: inputs.platform != 'android' && needs.android_preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build node-pty linux-x64 prebuild
        shell: bash
        run: |
          set -euo pipefail
          pty_pkg="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['$GITHUB_WORKSPACE/apps/server'] }))")"
          pty_dir="$(dirname "$pty_pkg")"
          ( cd "$pty_dir" && npx --yes node-gyp rebuild )
          mkdir -p wsl-prebuild
          cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
          file wsl-prebuild/pty.node

      - name: Upload node-pty prebuild
        uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  windows_x64:
    name: Build Windows x64
    needs: [android_preflight, build_wsl_node_pty]
    if: inputs.platform != 'android' && needs.android_preflight.result == 'success' && needs.build_wsl_node_pty.result == 'success'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # Cloud sign-in config comes only from the caller's validated public_config
      # outputs (all-or-nothing, HTTPS-only). Do not fall back to raw repo vars:
      # that would bypass validation and embed rejected or partial config.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ inputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ inputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ inputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Download WSL node-pty prebuild
        uses: actions/download-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ inputs.release_version }}"

      - name: Prepare Azure Trusted Signing
        if: inputs.windows_signing
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing disabled; missing one or more signing secrets."
            exit 0
          }

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - name: Build Windows desktop artifact
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          args=(
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ inputs.release_version }}" \
            --wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node" \
            --verbose
          )

          if [[ "${{ inputs.windows_signing }}" == "true" ]]; then
            missing=()
            for name in \
              AZURE_TENANT_ID \
              AZURE_CLIENT_ID \
              AZURE_CLIENT_SECRET \
              AZURE_TRUSTED_SIGNING_ENDPOINT \
              AZURE_TRUSTED_SIGNING_ACCOUNT_NAME \
              AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME \
              AZURE_TRUSTED_SIGNING_PUBLISHER_NAME; do
              if [[ -z "${!name:-}" ]]; then
                missing+=("$name")
              fi
            done

            if (( ${#missing[@]} == 0 )); then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              printf 'Windows signing disabled; missing secrets: %s\n' "${missing[*]}"
            fi
          fi

          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect Windows release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in "release/*.exe" "release/*.blockmap" "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: release-publish/*
          if-no-files-found: error

      - name: Cancel paired release jobs
        if: ${{ failure() && inputs.platform == 'both' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh run cancel "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" || true

  windows_launch_smoke:
    name: Windows Launch Smoke
    needs: windows_x64
    if: inputs.platform != 'android' && needs.windows_x64.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Download Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-x64
          path: release-assets

      - id: install
        name: Install Windows desktop artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path release-assets -Filter "*.exe" |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "No NSIS installer found in release-assets."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "t3code-install"
          if (Test-Path $installDir) {
            Remove-Item -Recurse -Force $installDir
          }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null

          $process = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList @("/S", "/D=$installDir") `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($process.ExitCode)."
          }

          $appExe = Get-ChildItem -Path $installDir -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -notmatch "uninstall|unins" } |
            Sort-Object FullName |
            Select-Object -First 1
          if (-not $appExe) {
            throw "No installed application executable found under $installDir."
          }

          "app_exe=$($appExe.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Installed desktop executable: $($appExe.FullName)"

      - name: Launch installed Windows desktop app
        shell: pwsh
        run: node scripts/desktop-launch-smoke.mjs --command "${{ steps.install.outputs.app_exe }}" --timeout-ms 90000

  publish_release:
    name: Publish GitHub Release
    needs: [android_preflight, android_apk, server_e2e_gate, windows_x64, windows_launch_smoke]
    # Windows is the always-on artifact for this fork. Publish whenever the
    # Windows build succeeds and either the Android APK built or Android is not
    # required, so a flaky/misconfigured EAS build never blocks the release.
    if: >-
      ${{
        always() &&
        needs.android_preflight.result == 'success' &&
        needs.server_e2e_gate.result == 'success' &&
        (
          inputs.platform == 'windows' ||
          needs.android_apk.result == 'success' ||
          (inputs.platform == 'both' && !inputs.android_required)
        ) &&
        (
          inputs.platform == 'android' ||
          needs.windows_x64.result == 'success'
        ) &&
        (
          inputs.platform == 'android' ||
          needs.windows_launch_smoke.result == 'success'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          pattern: "*"
          merge-multiple: true
          path: release-assets

      - id: release_files
        name: Resolve release files
        shell: bash
        run: |
          set -euo pipefail
          files="$(
            find release-assets -maxdepth 1 -type f \
              \( -name '*.apk' -o -name '*.exe' -o -name '*.blockmap' -o -name '*.yml' \) \
              | sort
          )"
          if [[ -z "$files" ]]; then
            echo "::error::No release assets were downloaded."
            exit 1
          fi
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ inputs.ref }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.make_latest }}
          files: ${{ steps.release_files.outputs.files }}
          fail_on_unmatched_files: true
          token: ${{ github.token }}

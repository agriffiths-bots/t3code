# factory.conf — repo-specific knobs for the software-factory commit gate.
# Sourced (bash) by scripts/factory/precommit-gate.sh. Fork-local file: never
# expect this upstream.

# Static checks, run from the repo root; all must exit 0. These must NOT modify
# files (no --fix inside the gate — fix, re-stage, retry instead). The repo's
# checks are read-only, so the gate can overlap them and replay logs in the
# configured order.
FACTORY_STATIC_CHECKS_PARALLEL=1
FACTORY_STATIC_CHECKS=(
  "node scripts/codex-usage-auth-guard.mjs"
  "node_modules/.bin/vp run --cache typecheck"
  "node_modules/.bin/vp check"
)

# Autoreview helper. The helper path is PINNED (no env override): the
# gate is the last deterministic reviewer before a commit, so an inherited
# AUTOREVIEW var must not be able to swap in a different executable. Models
# are pinned explicitly so a helper-default drift can't change the reviewers.
FACTORY_AUTOREVIEW_BIN="$HOME/.claude/skills/autoreview/scripts/autoreview"
FACTORY_REVIEW_ARGS=(
  --reviewers codex
  --model codex=gpt-5.6-sol --thinking codex=high
  --persist-sessions
)

# Ref used to structurally verify "upstream-origin" dismissals: a dismissal is
# only accepted when the staged blob is byte-identical to this ref's blob.
FACTORY_UPSTREAM_REF="upstream/main"

# Audit log (JSONL, appended) for every gate decision, dismissal, and skip.
FACTORY_AUDIT_LOG="$HOME/.openclaw/audit/factory-precommit.jsonl"

# Number of unique findings from prior rounds on this worktree/branch to pass
# back as settled reviewer memory. Audited dismissals are always retained.
FACTORY_REVIEW_MEMORY_FINDINGS=15
